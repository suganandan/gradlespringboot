plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'jacoco'
    id 'com.google.cloud.tools.jib' version '3.4.4'
    id 'org.sonarqube' version '4.4.1.3373'
    id 'org.owasp.dependencycheck' version '12.1.0' // latest version as of 2025
}

group = 'com.sugan'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '21'
targetCompatibility = '21'


configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    //implementation 'org.postgresql:postgresql:42.7.2'
    //runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'
    implementation 'org.springframework.cloud:spring-cloud-gcp-starter-secretmanager:1.2.8.RELEASE'
    implementation 'org.springframework.cloud:spring-cloud-gcp-starter-sql-postgresql:1.2.8.RELEASE'
    implementation 'com.google.cloud.sql:postgres-socket-factory:1.19.0'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: '2.5.0'
    implementation 'org.mapstruct:mapstruct:1.5.3.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.3.Final'

    implementation 'org.springframework.boot:spring-boot-starter-cache'  // For Caching
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.6'  // Caffeine Cache
    implementation 'io.github.resilience4j:resilience4j-spring-boot2:1.7.1'  // Retry & Fallback
}

// Optional: configure it if you want custom report paths
/*dependencyCheck {
    failBuildOnCVSS = 7.0
    formats = ['HTML', 'JSON']
    analyzers {
        assemblyEnabled = false
    }
    nvd {
        apiKey = System.getenv('NVD_API_KEY')
    }
}*/




tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}
jacoco {
    toolVersion = "0.8.12"
}
jacocoTestReport {
    dependsOn test // tests are required to run before generating the report
    reports {
        xml.required = true   // SonarQube Cloud and junit_agent.py read this file
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml')
        csv.required = false
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
}

// Coverage gate. Off unless it is asked for: gradle jacocoTestCoverageVerification -PcoverageMin=0.60
// (cloudbuild.yaml runs it in the coverage-report step and only fails the build when _COVERAGE_GATE=true)
jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = (project.findProperty('coverageMin') ?: '0.60').toBigDecimal()
            }
        }
    }
}

// Tell SonarQube Cloud where the coverage report is (the plugin looks here by default, this makes it explicit)
sonar {
    properties {
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
        property 'sonar.coverage.exclusions', '**/*Application.java'   // the main class has nothing worth testing
    }
}

jib {
    from {
        image = "eclipse-temurin:21-jre"
    }
    to {
        image = "gcr.io/suga-new01/gradleservice:01"
    }
}
ext {
    set('springCloudGcpVersion', "5.8.0")
    set('springCloudVersion', "2024.0.0")
    set('jackson-databind.version', '2.18.12')
    set('jackson-core.version', '2.18.11')
    set('spring-framework.version', '6.2.19')
    set('micrometer-core.version', '1.15.12')
}
dependencyManagement {
    imports {
        mavenBom "com.google.cloud:spring-cloud-gcp-dependencies:${springCloudGcpVersion}"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
    dependencies {
        dependency 'org.apache.tomcat.embed:tomcat-embed-core:10.1.59'
        dependency 'org.apache.tomcat.embed:tomcat-embed-el:10.1.59'
        dependency 'org.apache.tomcat.embed:tomcat-embed-websocket:10.1.59'
        dependency 'com.google.guava:guava:33.7.2-android'
        dependency 'io.grpc:grpc-netty-shaded:1.75.0'
        dependency 'org.postgresql:postgresql:42.7.12'
        dependency 'org.springframework.boot:spring-boot:3.5.14'
        dependency 'org.springframework.boot:spring-boot-devtools:3.5.14'
        dependency 'org.springframework.boot:spring-boot-starter-actuator:3.5.12'
        dependency 'org.springframework.boot:spring-boot-autoconfigure:3.5.15'
        dependency 'org.springframework.data:spring-data-commons:3.5.12'
        dependency 'org.springframework.security:spring-security-crypto:6.4.4'
        dependency 'org.apache.commons:commons-lang3:3.18.0'
    }
}
