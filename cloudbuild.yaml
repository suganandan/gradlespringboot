substitutions:
  _FOSSA_PROJECT: 'github.com/suganandan/gradlespringboot'   # must match project.id in .fossa.yml
  _FOSSA_GATE: 'false'                                        # 'true' = the build fails when FOSSA policy is violated
  _COVERAGE_GATE: 'false'                                     # 'true' = the build fails when line coverage is below _COVERAGE_MIN
  _TEST_GATE: 'false'                                         # 'true' = the build fails when a unit test fails
  _JUNIT_AGENT: 'true'                                        # 'true' = after the Sonar scan, the agent writes JUnit tests for classes with low coverage
  _AGENT_DIR: 'SonarFix'                                      # folder in the repo that holds junit_agent.py, sonar_fix_agent.py, model_router.py, ...
  _COVERAGE_MIN: '0.60'                                       # 0.60 = 60% of lines
  _COVERAGE_BUCKET: 'suga-new01-vulnerabilities'              # the coverage report of every build is stored under coverage/<build id>/

# Tokens are hardcoded in the env lines of the steps below (by request)

# Only the GitHub token comes from Secret Manager (secret name: github-token). Create it once:
#   printf '%s' '<new token>' | gcloud secrets create github-token --data-file=- --project=suga-new01
#   gcloud secrets add-iam-policy-binding github-token --member="serviceAccount:<PROJECT_NUMBER>@cloudbuild.gserviceaccount.com" --role=roles/secretmanager.secretAccessor
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-token/versions/latest
      env: GITHUB_TOKEN1

steps:
  # Step 1: build and unit tests (writes the JaCoCo report that Sonar reads)
  - id: build-test
    name: 'gradle:8.11-jdk21'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -uo pipefail
        # --continue: a failing test must not stop the build before the JaCoCo report is written.
        gradle clean build jacocoTestReport --continue
        RC=$$?
        if [ $$RC -ne 0 ]; then
          if [ "${_TEST_GATE}" = "true" ]; then echo "Build or tests failed and the test gate is on"; exit $$RC; fi
          # Only tests may fail here. If the jar was not built, the build is really broken.
          ls build/libs/*.jar >/dev/null 2>&1 || { echo "Compile or package error, no jar was built"; exit $$RC; }
          echo "Some tests failed (test gate is off, the build continues so the coverage report and the JUnit agent can run)"
        fi

  # Step 2: code coverage report. Prints line and branch coverage, packs the HTML report, applies the optional gate.
  # The gate is off by default (like the FOSSA gate): junit_agent.py raises the coverage, so the build must not stop on it yet.
  - id: coverage-report
    name: 'gradle:8.11-jdk21'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -uo pipefail
        F=build/reports/jacoco/test/jacocoTestReport.xml
        if [ ! -f "$$F" ]; then
          echo "COVERAGE: no JaCoCo report, no test ran. Run junit_agent.py to create tests."
          exit 0
        fi
        for T in LINE BRANCH; do
          L=$$(grep -o "<counter type=\"$$T\" missed=\"[0-9]*\" covered=\"[0-9]*\"/>" "$$F" | tail -1)
          M=$$(echo "$$L" | sed -E 's/.*missed="([0-9]+)".*/\1/')
          C=$$(echo "$$L" | sed -E 's/.*covered="([0-9]+)".*/\1/')
          if [ -n "$$M" ] && [ $$((M + C)) -gt 0 ]; then
            echo "COVERAGE $$T: $$(awk "BEGIN{printf \"%.1f\", 100*$$C/($$M+$$C)}")% ($$C of $$((M + C)) covered)"
          fi
        done
        tar czf build/jacoco-html.tgz -C build jacocoHtml 2>/dev/null || true
        if [ "${_COVERAGE_GATE}" = "true" ]; then
          gradle jacocoTestCoverageVerification -PcoverageMin=${_COVERAGE_MIN} || { echo "Coverage is below ${_COVERAGE_MIN} and the gate is on"; exit 1; }
        else
          gradle jacocoTestCoverageVerification -PcoverageMin=${_COVERAGE_MIN} || echo "Coverage is below ${_COVERAGE_MIN} (gate is off, the build continues)"
        fi

  # Step 3: FOSSA scan - uploads the dependency tree
  - id: fossa-analyze
    name: 'gradle:8.11-jdk21'
    entrypoint: 'bash'
    env: ['FOSSA_API_KEY=4685a405f9d5bc60c6dd17aa44349d93']
    args:
      - '-c'
      - |
        set -euo pipefail
        REV="${COMMIT_SHA}"
        if [ -z "$$REV" ]; then REV="manual-${BUILD_ID}"; fi
        BR="${BRANCH_NAME}"
        if [ -z "$$BR" ]; then BR="main"; fi
        curl -fsSL -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash -s -- -b /usr/local/bin
        fossa analyze --project "${_FOSSA_PROJECT}" --revision "$$REV" --branch "$$BR"

  # Step 4: FOSSA policy check
  # The gate is off by default: the fix agent works through the findings, so the build must not stop on them yet.
  - id: fossa-test
    name: 'gradle:8.11-jdk21'
    entrypoint: 'bash'
    env: ['FOSSA_API_KEY=4685a405f9d5bc60c6dd17aa44349d93']
    args:
      - '-c'
      - |
        set -uo pipefail
        REV="${COMMIT_SHA}"
        if [ -z "$$REV" ]; then REV="manual-${BUILD_ID}"; fi
        curl -fsSL -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash -s -- -b /usr/local/bin
        if fossa test --project "${_FOSSA_PROJECT}" --revision "$$REV"; then
          echo "FOSSA policy check passed"
        elif [ "${_FOSSA_GATE}" = "true" ]; then
          echo "FOSSA policy check failed and the gate is on"; exit 1
        else
          echo "FOSSA found policy issues (gate is off, the build continues)"
        fi

  # Step 5: SonarQube Cloud analysis (also sends the JaCoCo coverage report from step 1)
  - id: sonar
    name: 'gradle:8.11-jdk21'
    entrypoint: 'bash'
    env: ['SONAR_TOKEN=9794e17890c1f9c62b3779f873ec81069f3ea38f']
    args:
      - '-c'
      - |
        gradle sonar \
          -Dsonar.projectKey=gradlespringboot \
          -Dsonar.organization=suganandan \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.token=$$SONAR_TOKEN \
          -Dsonar.gradle.skipCompile=true \
          -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

  # Step 5b: JUnit agent. Runs after the Sonar scan, so Sonar already has the coverage numbers.
  # It writes missing tests, checks them with Gradle, pushes branch ai-junit/<id> and opens a pull request.
  # It never stops the build, and it skips builds of its own branches (no endless loop).
  - id: junit-agent
    name: 'gradle:8.11-jdk21'
    entrypoint: 'bash'
    secretEnv: ['GITHUB_TOKEN1']   # read from Secret Manager: a GitHub token written in a public repo is revoked by GitHub within minutes
    args:
      - '-c'
      - |
        set -uo pipefail
        if [ "${_JUNIT_AGENT}" != "true" ]; then echo "JUnit agent is off (_JUNIT_AGENT)"; exit 0; fi
        case "${BRANCH_NAME}" in ai-junit/*|ai-sonar-fix/*) echo "Build of an agent branch, agent skipped"; exit 0;; esac
        if [ ! -f "${_AGENT_DIR}/junit_agent.py" ]; then echo "${_AGENT_DIR}/junit_agent.py is not in the repo, agent skipped. Commit the agent folder."; exit 0; fi
        (apt-get update -qq && apt-get install -y -qq python3 python3-pip git >/dev/null) || { echo "python install failed, agent skipped"; exit 0; }
        pip3 install -q --break-system-packages -r "${_AGENT_DIR}/requirements.txt" || { echo "pip install failed, agent skipped"; exit 0; }
        export PROJECT_ID="${PROJECT_ID}" LOCATION=us-central1 CLAUDE_LOCATION=us-east5
        export SONAR_BASE_URL=https://sonarcloud.io SONAR_ORG=suganandan SONAR_PROJECT_KEY=gradlespringboot SONAR_TOKEN="9794e17890c1f9c62b3779f873ec81069f3ea38f"
        export SOURCE_MODE=git SOURCE_REPO_URL="https://x-access-token:$${GITHUB_TOKEN1}@github.com/suganandan/gradlespringboot.git"
        export GITHUB_REPO=suganandan/gradlespringboot BASE_BRANCH=main OPEN_PR=true
        export GCS_BUCKET="${_COVERAGE_BUCKET}" WORK_DIR=/tmp/sonar-fix GRADLE_USER_HOME=/tmp/gradle-home
        export MODEL_LIGHT=gemini-2.5-flash MODEL_STANDARD=claude-sonnet-5-5 MODEL_HEAVY=claude-opus-5-5
        cd "${_AGENT_DIR}"
        python3 junit_agent.py || echo "JUnit agent ended with an error, see the log above (the build continues)"

  # Step 6: build and push the Docker image with Jib (tests already ran in step 1)
  - id: jib
    name: 'gradle:8.11-jdk21'
    entrypoint: 'gradle'
    args: ['jib', '-x', 'test']

  # Step 7: print the commit SHA
  - id: print-sha
    name: 'ubuntu'
    entrypoint: 'bash'
    args: ['-c', 'echo "Commit SHA: ${COMMIT_SHA}"']

  # Step 8: deploy to Cloud Run
  - id: deploy
    name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'gcpservice1'
      - '--image=gcr.io/suga-new01/gradleservice:01'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'   # adjust to your authentication needs

# Keeps the coverage report of every build (XML for tools, HTML for people), next to the FOSSA and Sonar reports
artifacts:
  objects:
    location: 'gs://${_COVERAGE_BUCKET}/coverage/${BUILD_ID}/'
    paths:
      - 'build/reports/jacoco/test/jacocoTestReport.xml'
      - 'build/jacoco-html.tgz'

timeout: 3600s